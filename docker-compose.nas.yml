services:
  ffxi:
    image: ffxi-server:slim   # loaded with: docker load < ffxi-server-slim.tar.gz
    container_name: ffxi-server
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    # Host networking: the server decides which address to hand the PS2 from the machine's own
    # network, so a container with a private 172.x address could give players an unreachable one.
    # Ports in use on the host: TCP 54001, UDP 54240, TCP 54242, TCP 54460, web UI 9669 (WEBUI_PORT).
    network_mode: host
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:?set WEBUI_PASSWORD in .env}
      WEBUI_PORT: "9669"                 # host networking has no separate inner port: the UI itself listens here
      # SERVER_NAME: "My World"       # optional: if set, it is applied at EVERY container start and overrides what you set in the UI
      SERVER_ADDRESS: ${SERVER_ADDRESS:-}   # optional: public hostname/IP for internet players
    volumes:
      # Real folders on the NAS, so you can copy files in and out. Both folders must exist and be owned by UID 1000
      # (the container user), and ffxi-settings must be seeded once from the image: see the steps in the chat.
      - /volume1/docker/ffxi-server/ffxi-data:/ffxi/Server/data               # database, profiles, roles, chat, backups, logs
      - /volume1/docker/ffxi-server/ffxi-settings:/ffxi/Server/lsb/settings   # rates and rules are edited in main.lua / map.lua here
